<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nie tego się spodziewałeś?</title>

<!-- GOATCOUNTER -->
<script data-goatcounter="https://spermersi.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    background: #000;
    color: #fff;
  }

  .stars {
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: -2;
  }

  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 2s infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.2; }
    to { opacity: 1; }
  }

  .container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100%;
    padding: 2rem;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  h1 {
    font-size: clamp(1.8rem, 5vw, 3rem);
    line-height: 1.4;
    background: rgba(0,0,0,0.35);
    padding: 1rem 2rem;
    border-radius: 12px;
    margin-bottom: 1.5rem;
  }

  /* PROGRESS BAR */
  .progress-wrapper {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.15);
    border-radius: 999px;
    overflow: hidden;
    height: 18px;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff7675, #ffeaa7);
    transition: width 1.2s ease;
  }

  .progress-text {
    margin-top: 0.5rem;
    font-size: 0.9rem;
    opacity: 0.8;
  }

  .rocket {
    position: absolute;
    width: 60px;
    bottom: -120px;
  }

  @media (max-width: 500px) {
    .rocket { width: 40px; }
    h1 { font-size: 1.6rem; }
  }
</style>
</head>

<body>

<div class="stars"></div>

<div class="container">
  <h1>Nie tego się spodziewałeś?<br>My też nie.</h1>

  <div class="progress-wrapper">
    <div class="progress-bar" id="progress"></div>
  </div>
  <div class="progress-text" id="progressText">
    Ładowanie liczby odwiedzin…
  </div>
</div>

<div id="rockets"></div>

<script>
/* GWIAZDY */
const starContainer = document.querySelector('.stars');
const starCount = 100;
let width = window.innerWidth;
let height = window.innerHeight;

for (let i = 0; i < starCount; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  const size = Math.random() * 2 + 1;
  star.style.width = `${size}px`;
  star.style.height = `${size}px`;
  star.style.top = `${Math.random() * height}px`;
  star.style.left = `${Math.random() * width}px`;
  starContainer.appendChild(star);
}

/* RAKIETY */
function createRocket() {
  const rocket = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  rocket.setAttribute("class", "rocket");
  rocket.setAttribute("viewBox", "0 0 100 200");
  rocket.innerHTML = `
    <rect x="40" y="60" width="20" height="80" rx="10" fill="#ccc"/>
    <polygon points="50,20 70,60 30,60" fill="#fff"/>
    <circle cx="50" cy="80" r="7" fill="#090a0f"/>
    <polygon points="40,140 30,170 40,170" fill="#ff7675"/>
    <polygon points="60,140 70,170 60,170" fill="#ff7675"/>
  `;
  document.getElementById('rockets').appendChild(rocket);

  rocket.style.left = `${Math.random() * (window.innerWidth - 60)}px`;

  rocket.animate([
    { transform: 'translateY(0)' },
    { transform: `translateY(-${window.innerHeight + 200}px)` }
  ], {
    duration: 5000 + Math.random() * 3000,
    easing: 'linear'
  }).onfinish = () => {
    rocket.remove();
    createRocket();
  };
}

for (let i = 0; i < 3; i++) setTimeout(createRocket, i * 1000);

/* PROGRESS BAR – GOATCOUNTER */
const GOAL = 1000;

fetch('https://spermersi.goatcounter.com/counter.json')
  .then(res => res.json())
  .then(data => {
    const visits = data.count;
    const percent = Math.min(visits / GOAL * 100, 100);

    document.getElementById('progress').style.width = percent + '%';
    document.getElementById('progressText').innerText =
      `${visits} / ${GOAL} wyświetleń`;
  })
  .catch(() => {
    document.getElementById('progressText').innerText =
      'Nie udało się pobrać danych';
  });

window.addEventListener('resize', () => {
  width = window.innerWidth;
  height = window.innerHeight;
});
</script>

</body>
</html>
