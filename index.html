<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nie tego się spodziewałeś?</title>

<!-- GoatCounter (OFICJALNY LICZNIK) -->
<script data-goatcounter="https://spermersi.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  font-family: system-ui, sans-serif;
  overflow: hidden;
  background: #000;
  color: #fff;
}

/* Tło – gwiazdy */
.stars {
  position: absolute;
  width: 100%;
  height: 100%;
  z-index: -2;
}

.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  opacity: 0.8;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from { opacity: 0.2; }
  to { opacity: 1; }
}

/* Główna kolumna */
.container {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100%;
  padding: 2rem;
  text-align: center;
  gap: 1.5rem;
  position: relative;
  z-index: 1;
}

h1 {
  font-size: clamp(1.8rem, 5vw, 3rem);
  line-height: 1.4;
  background: rgba(0,0,0,0.3);
  padding: 1rem 2rem;
  border-radius: 12px;
}

/* PRZYCISK */
#cta {
  padding: 12px 26px;
  font-size: 1rem;
  font-weight: 600;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  background: #00aaff;
  color: #000;
  transition: transform .2s ease, background .2s ease;
}

#cta:hover {
  background: #00ffcc;
  transform: scale(1.05);
}

#cta.animating {
  animation: pulse 0.4s ease-in-out 2, fadeOut 0.8s ease forwards;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

@keyframes fadeOut {
  to { opacity: 0; }
}

/* PROGRESS */
#progress-container {
  width: min(90%, 420px);
  height: 20px;
  background: rgba(255,255,255,0.15);
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  font-size: 12px;
}

#progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #00ffcc, #00aaff);
  transition: width .6s ease;
}

#progress-label {
  position: absolute;
  width: 100%;
  text-align: center;
  line-height: 20px;
}

/* Rakiety */
.rocket {
  position: absolute;
  width: 60px;
  bottom: -120px;
}

@media (max-width: 500px) {
  .rocket { width: 40px; }
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="container">

  <!-- PRZYCISK WYŻEJ -->
  <button id="cta">Spróbujesz?</button>

  <h1>Nie tego się spodziewałeś?<br>My też nie.</h1>

  <!-- LICZNIK -->
  <div id="progress-container">
    <div id="progress-bar"></div>
    <div id="progress-label">Ładowanie…</div>
  </div>

  <!-- GoatCounter wstawia tu licznik (ukryty) -->
  <div id="visitor-counter" style="display:none;"></div>

</div>

<div id="rockets"></div>

<script>
/* Gwiazdy */
const starContainer = document.querySelector('.stars');
for (let i = 0; i < 100; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  const size = Math.random() * 2 + 1;
  star.style.width = size + 'px';
  star.style.height = size + 'px';
  star.style.top = Math.random() * innerHeight + 'px';
  star.style.left = Math.random() * innerWidth + 'px';
  starContainer.appendChild(star);
}

/* Rakiety */
function createRocket() {
  const r = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  r.classList.add('rocket');
  r.setAttribute("viewBox", "0 0 100 200");
  r.innerHTML = `
    <rect x="40" y="60" width="20" height="80" rx="10" fill="#ccc"/>
    <polygon points="50,20 70,60 30,60" fill="#fff"/>
    <circle cx="50" cy="80" r="7" fill="#090a0f"/>
  `;
  document.body.appendChild(r);
  r.style.left = Math.random() * (innerWidth - 60) + 'px';

  r.animate(
    [{ transform: 'translateY(0)' },
     { transform: `translateY(-${innerHeight + 200}px)` }],
    { duration: 5000 + Math.random() * 3000, easing: 'linear' }
  ).onfinish = () => {
    r.remove();
    createRocket();
  };
}
for (let i = 0; i < 3; i++) setTimeout(createRocket, i * 1000);

/* Oficjalny licznik GoatCounter → progress */
(function initCounter(){
  const wait = setInterval(() => {
    if (window.goatcounter?.visit_count) {
      clearInterval(wait);
      window.goatcounter.visit_count({
        append: '#visitor-counter',
        no_branding: true
      });

      setTimeout(() => {
        const el = document.querySelector('#visitor-counter');
        const num = parseInt(el.textContent.replace(/\D/g,'')) || 0;
        const max = 1000;
        const pct = Math.min(num / max * 100, 100);

        document.getElementById('progress-bar').style.width = pct + '%';
        document.getElementById('progress-label').textContent =
          `${num} / ${max} wyświetleń`;
      }, 300);
    }
  }, 100);
})();

/* Przycisk → animacja → redirect */
document.getElementById('cta').addEventListener('click', e => {
  const btn = e.currentTarget;
  btn.classList.add('animating');
  setTimeout(() => {
    window.location.href = 'http://onet.pl';
  }, 800);
});
</script>

</body>
</html>
