<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nie tego się spodziewałeś?</title>
<style>
  /* Reset */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    background: #000;
    color: #fff;
  }

  /* Gwiazdy */
  .stars {
    position: absolute;
    width: 100%;
    height: 100%;
    background: transparent;
    z-index: -2;
  }

  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 2s infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.2; }
    to { opacity: 1; }
  }

  /* Hasło */
  .content {
    position: absolute;
    top: 50%;
    width: 90%;
    text-align: center;
    transform: translateY(-50%);
    z-index: 1;
    text-shadow: 0 4px 20px rgba(0,0,0,0.7);
  }

  h1 {
    font-size: clamp(1.8rem, 5vw, 3rem);
    line-height: 1.2;
  }

  /* Rakiety */
  .rocket {
    position: absolute;
    width: 60px;
    bottom: -120px;
  }

  @media (max-width: 500px) {
    .rocket { width: 40px; }
    h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<div class="stars"></div>

<div class="content">
  <h1>Nie tego się spodziewałeś?<br>My też nie.</h1>
</div>

<!-- Kontener na rakiety -->
<div id="rockets"></div>

<script>
  // Generujemy gwiazdy
  const starContainer = document.querySelector('.stars');
  const starCount = 100;
  const width = window.innerWidth;
  const height = window.innerHeight;

  for (let i = 0; i < starCount; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2 + 1;
    star.style.width = `${size}px`;
    star.style.height = `${size}px`;
    star.style.top = `${Math.random() * height}px`;
    star.style.left = `${Math.random() * width}px`;
    starContainer.appendChild(star);
  }

  // Funkcja tworząca rakietę
  function createRocket() {
    const rocket = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    rocket.setAttribute("class", "rocket");
    rocket.setAttribute("viewBox", "0 0 100 200");
    rocket.innerHTML = `
      <rect x="40" y="60" width="20" height="80" rx="10" fill="#ccc"/>
      <polygon points="50,20 70,60 30,60" fill="#fff"/>
      <circle cx="50" cy="80" r="7" fill="#090a0f"/>
      <polygon points="40,140 30,170 40,170" fill="#ff7675"/>
      <polygon points="60,140 70,170 60,170" fill="#ff7675"/>
    `;
    document.getElementById('rockets').appendChild(rocket);

    // Losowa pozycja początkowa
    const startX = Math.random() * (window.innerWidth - 60);
    rocket.style.left = `${startX}px`;
    rocket.style.bottom = `-120px`;

    // Animacja w górę
    const duration = 5000 + Math.random() * 3000; // 5-8s
    rocket.animate([
      { transform: `translateY(0px)` },
      { transform: `translateY(-${window.innerHeight + 150}px)` }
    ], {
      duration: duration,
      easing: 'linear'
    }).onfinish = () => {
      rocket.remove();
      createRocket(); // Tworzymy nową rakietę w pętli
    };
  }

  // Uruchamiamy kilka rakiet na start
  for (let i = 0; i < 3; i++) {
    setTimeout(createRocket, i * 1000);
  }

  // Odświeżamy szerokość i wysokość przy zmianie rozmiaru
  window.addEventListener('resize', () => {
    window.innerWidth = document.documentElement.clientWidth;
    window.innerHeight = document.documentElement.clientHeight;
  });
</script>

</body>
</html>
